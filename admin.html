<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARTIN_NNG Admin</title>

<style>

body{
    background:#050505;
    color:white;
    font-family:tahoma;
    text-align:center;
    padding:30px;
}

.box{
    max-width:500px;
    margin:auto;
    background:#111c;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 25px #00ffff55;
}

h1,h2{
    color:#00ffff;
}

input,textarea,button{
    width:90%;
    padding:15px;
    margin:10px;
    border-radius:15px;
    border:none;
}

button{
    background:#00ffff;
    font-weight:bold;
    cursor:pointer;
}

textarea{
    height:150px;
}

#panel{
    display:none;
}

.chatbox{
    max-height:400px;
    overflow-y:auto;
    background:#111;
    padding:10px;
    border-radius:15px;
}

.chatmsg{
    background:#00ffff;
    color:black;
    padding:10px;
    margin:10px;
    border-radius:15px;
}

.delete{
    background:red;
    color:white;
    padding:8px;
    width:auto;
}

</style>

</head>


<body>


<div class="box">

<h1>ARTIN_NNG</h1>

<h2>🔐 مدیریت</h2>


<input id="email" type="email" placeholder="ایمیل">

<input id="password" type="password" placeholder="رمز عبور">

<button onclick="login()">
ورود
</button>



<div id="panel">

<h2>📅 تغییر برنامه روز</h2>


<textarea id="plan" placeholder="برنامه جدید"></textarea>


<button onclick="savePlan()">
ذخیره برای همه
</button>

<h2>💬 مدیریت چت</h2>

<button onclick="loadMessages()">
نمایش پیام‌ها
</button>

<div id="messages" class="chatbox"></div>

<h2>📢 ارسال اطلاعیه</h2>

<textarea id="adminMessage"
placeholder="پیام ادمین..."></textarea>

<button onclick="sendAdminMessage()">
📤 ارسال پیام ادمین
</button>

</div>


</div>

<div id="usersPanel" style="display:none">

<div class="admin-users-box">

<div class="box">

<h2>👥 مدیریت کاربران</h2>

<div>
<input id="userSearch" placeholder="🔍 جستجوی ایمیل...">

<button onclick="searchUsers()">
🔍 جستجو
</button>
</div>

<div id="usersList"></div>

</div>

</div>



<script>

const SUPABASE_URL =
"https://cqxueguuqmyryttbppcb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_93n_d6h9xvNtVf73_UT0ZA_gW14NFX0";

async function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;


let res=await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify({
email,
password
})
});


let data=await res.json();

localStorage.setItem("access_token", data.access_token);


if(!data.access_token){
alert(JSON.stringify(data));
return;
}


let user=await fetch(
SUPABASE_URL+"/rest/v1/profile?email=eq."+email+"&select=is_admin",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+data.access_token
}
});


let admin=await user.json();


if(admin[0]?.is_admin){

localStorage.setItem(
"token",
data.access_token
);

document.getElementById("panel").style.display="block";

document.getElementById("usersPanel").style.display="block";

loadUsers();

alert("ادمین وارد شد");

}else{

alert("شما ادمین نیستید");

}

}



async function savePlan(){

let text =
document.getElementById("plan").value;

let res = await fetch(
SUPABASE_URL + "/rest/v1/daily_plan?id=eq.3",
{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + localStorage.getItem("token")
},

body:JSON.stringify({

content:text,

updated_at:new Date()

})

}
);


if(res.ok){

alert("برنامه ذخیره شد ✅");

}

else{

let err = await res.text();
alert(err);

}

}


async function loadMessages(){

let res = await fetch(
SUPABASE_URL+"/rest/v1/messages?select=*&order=id.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+localStorage.getItem("access_token")
}
}
);


let data = await res.json();

let box=document.getElementById("messages");

box.innerHTML="";


data.forEach(m=>{

box.innerHTML += `

<div class="chatmsg">

<b>${m.username}</b>

<br>

${m.message}

<br>

<small>
${new Date(m.created_at).toLocaleString("fa")}
</small>

<br>

<button class="delete"
onclick="deleteMessage(${m.id})">
🗑 حذف
</button>

</div>

`;

});

}



async function deleteMessage(id){

if(!confirm("این پیام حذف شود؟")) return;


await fetch(
SUPABASE_URL+"/rest/v1/messages?id=eq."+id,
{
method:"DELETE",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+localStorage.getItem("access_token")
}
}
);


loadMessages();

}
async function sendAdminMessage(){

let text = document.getElementById("adminMessage").value;

if(text.trim()==""){
    alert("پیام را وارد کنید");
    return;
}

await fetch(
SUPABASE_URL+"/rest/v1/messages",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+localStorage.getItem("access_token")
},

body:JSON.stringify({

username:"🛡️👑 ARTIN_NNG",

message:text,

is_admin:true

})

});

document.getElementById("adminMessage").value="";

alert("اطلاعیه ارسال شد ✅");

loadMessages();

}

let allUsers=[];
let searchMode = false;


async function loadUsers(){

let res = await fetch(
SUPABASE_URL+"/rest/v1/profile?select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+localStorage.getItem("access_token")
}
}
);


allUsers = await res.json();

console.log(allUsers);

if(!searchMode){
    showUsers(allUsers);
}

}



function showUsers(users){

let box=document.getElementById("usersList");

box.innerHTML="";


users.forEach(u=>{

box.innerHTML += `

<div class="box">

<p>📧 ${u.email}</p>

<p>
${u.banned ? "🔴 بن شده" : "🟢 فعال"}
</p>


<button onclick="banUser('${u.id}',${!u.banned})">

${u.banned ? "✅ رفع بن" : "🚫 بن"}

</button>


</div>

`;

});


}



function searchUsers(){


alert("جستجو انجام شد");



let text =
document.getElementById("userSearch").value
.toLowerCase();

if(text.trim() === ""){
    searchMode = false;
    showUsers(allUsers);
    return;
}

searchMode = true;


let result =
allUsers.filter(u=>
u.email.toLowerCase().includes(text)
);




console.log(result);

showUsers(result);

}




async function banUser(id,status){

let res = await fetch(
SUPABASE_URL+"/rest/v1/profile?id=eq."+id,
{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+localStorage.getItem("access_token"),
"Prefer":"return=representation"
},

body:JSON.stringify({

banned:status

})

});

let data = await res.text();

console.log(data);

if(res.ok){

alert(
status ?
"⛔ کاربر بن شد" :
"✅ بن کاربر برداشته شد"
);

searchMode = false;
loadUsers();

}else{

alert("خطا در بن کردن:\n"+data);

}

}




setInterval(loadUsers,3000);

</script>

</body>

</html>
