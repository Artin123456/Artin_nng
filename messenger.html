<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARTIN_NNG - پیام‌رسان</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#050505;color:#fff}
body{padding:18px}
.wrap{width:100%;max-width:700px;margin:0 auto}
.box{background:#0d0d0d;border:1px solid #00ffff55;border-radius:22px;padding:18px;box-shadow:0 0 25px #00ffff12}
h1,h2,h3{margin:0 0 12px}
h1{text-align:center;color:#00ffff;font-size:24px}
h2{font-size:19px}
.hint{color:#aaa;font-size:13px;line-height:1.8}
button,input{font:inherit}
button{border:1px solid #00ffff66;background:#111;color:#fff;border-radius:14px;padding:12px 16px;cursor:pointer}
button:hover{background:#161616}
input{display:block;width:100%;padding:12px;border-radius:14px;border:1px solid #00ffff55;background:#080808;color:#fff;outline:none}
input:focus{border-color:#00ffff}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back{width:48px;height:48px;padding:0;font-size:21px}
.searchRow{display:flex;gap:8px;margin-top:12px}
.searchRow input{flex:1}
.searchRow button{width:58px;padding:0}
.result,.contact{
  background:#151515;border:1px solid #00ffff33;border-radius:16px;
  padding:13px;margin-top:9px;cursor:pointer
}
.result:hover,.contact:hover{border-color:#00ffff88}
.phone{direction:ltr;text-align:left;color:#aaa;font-size:12px;margin-top:4px}
.add{width:100%;margin-top:10px}
.sectionTitle{margin-top:20px;font-size:15px;color:#00ffff}
.empty{color:#888;font-size:13px;padding:12px 0}
#searchBox{display:none}
.status{margin-top:10px;color:#ffcc66;font-size:13px}

.sectionTitle{margin-top:18px;margin-bottom:8px;font-weight:bold;color:#00ffff}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#ff245e;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
.lastMessage{margin-top:6px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inboxItem{cursor:pointer}
.secondaryBtn{margin-top:6px;background:#111!important}
.contactWrap{display:flex;align-items:stretch;gap:6px}.contactMain{flex:1;min-width:0}.menuBtn{width:44px;padding:0;font-size:20px;position:relative}.menuPopup{position:absolute;z-index:10;right:8px;top:46px;background:#101010;border:1px solid #00ffff55;border-radius:12px;padding:6px;box-shadow:0 8px 25px #000;min-width:120px}.menuPopup button{width:100%;padding:9px;border:0;background:transparent;color:#ff667f;text-align:right}.menuPopup button:hover{background:#1a1a1a}.contactRow{position:relative}</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div class="topbar">
      <button class="back" onclick="goHome()" title="بازگشت">↩️</button>
      <h1 style="flex:1">📨 پیام‌رسان</h1>
    </div>

    <p class="hint">این بخش یک صفحه جداگانه است؛ مثل یک پیام‌رسان مستقل.</p>

    <div id="searchBox">
      <div class="searchRow">
        <input id="userSearchPhone" type="tel" placeholder="شماره تلفن را وارد کنید">
        <button onclick="searchUsers()" title="جستجو">🔎</button>
      </div>
      <div id="userResults"></div>
    </div>

    <button style="width:100%;margin-top:10px" onclick="toggleSearch()">🔎 جستجوی کاربر</button>

    <div class="sectionTitle">👥 کاربران من</div>
    <div class="sectionTitle">📥 پیام‌ها</div><div id="inboxList" class="list"></div><div class="sectionTitle">👥 مخاطبین</div><div id="contactsList"></div>
    <div id="status" class="status"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://cqxueguuqmyryttbppcb.supabase.co";
const SUPABASE_KEY = "sb_publishable_93n_d6h9xvNtVf73_UT0ZA_gW14NFX0";

let currentUser = null;
let currentAccessToken = null;

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function loadSession(){
  try{
    currentUser = JSON.parse(sessionStorage.getItem("artin_nng_user") || "null");
    currentAccessToken = sessionStorage.getItem("artin_nng_token") || null;
  }catch(e){
    currentUser = null;
    currentAccessToken = null;
  }

  if(!currentUser || !currentAccessToken){
    alert("برای استفاده از پیام‌رسان ابتدا وارد حساب خود شوید.");
    window.location.href = "https://artin123456.github.io/Artin_nng/ArtinNNG_10.html";
    return false;
  }
  return true;
}

function goHome(){
  window.location.href = "https://artin123456.github.io/Artin_nng/ArtinNNG_10.html";
}

function toggleSearch(){
  const box = document.getElementById("searchBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
  if(box.style.display === "block"){
    document.getElementById("userSearchPhone").focus();
  }
}

function normalizeSearchPhone(phone){
  let p = phone.replace(/[^\d+]/g,"");
  if(p.startsWith("09")) p = "+98" + p.slice(1);
  else if(p.startsWith("98")) p = "+" + p;
  else if(p.startsWith("9")) p = "+98" + p;
  return p;
}

async function searchUsers(){
  if(!currentUser || !currentAccessToken) return;

  const raw = document.getElementById("userSearchPhone").value.trim();
  const phone = normalizeSearchPhone(raw);
  const resultsBox = document.getElementById("userResults");

  if(!phone){
    resultsBox.innerHTML = '<div class="empty">شماره تلفن را وارد کنید.</div>';
    return;
  }

  const res = await fetch(
    SUPABASE_URL + "/rest/v1/rpc/search_users_by_phone",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + currentAccessToken
      },
      body:JSON.stringify({p_phone:phone})
    }
  );

  const data = await res.json();

  if(!res.ok){
    resultsBox.innerHTML = '<div class="empty">جستجو آماده نیست. SQL پیام‌رسان را بررسی کنید.</div>';
    return;
  }

  const results = Array.isArray(data) ? data : [];
  const filtered = results.filter(u => u.id !== currentUser.id);

  if(!filtered.length){
    resultsBox.innerHTML = '<div class="empty">کاربری با این شماره پیدا نشد.</div>';
    return;
  }

  resultsBox.innerHTML = filtered.map(u => `
    <div class="result">
      <div><b>👤 ${escapeHtml(u.username || "کاربر")}</b></div>
      <div class="phone">${escapeHtml(u.phone || "")}</div>
      <button class="add" onclick="event.stopPropagation(); addContact('${String(u.id).replace(/'/g,"\\'")}','${escapeHtml(u.username || "کاربر").replace(/'/g,"\\'")}')">➕ افزودن کاربر</button>
    </div>
  `).join("");
}

async function addContact(contactId, username){
  const displayName = prompt("اسم کاربر را وارد کنید:", username || "");
  if(displayName === null) return;

  const name = displayName.trim();
  if(!name){
    alert("اسم کاربر را وارد کنید.");
    return;
  }

  const res = await fetch(
    SUPABASE_URL + "/rest/v1/contacts",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + currentAccessToken,
        "Prefer":"return=representation"
      },
      body:JSON.stringify({
        user_id:currentUser.id,
        contact_id:contactId,
        display_name:name
      })
    }
  );

  const data = await res.json();

  if(!res.ok){
    if(data && data.code === "23505"){
      alert("این کاربر قبلاً اضافه شده است.");
    }else{
      alert("افزودن کاربر انجام نشد.");
    }
    return;
  }

  await loadContacts();
}

async function loadInbox(){
  const box = document.getElementById("inboxList");
  if(!box) return;

  const res = await fetch(
    SUPABASE_URL + "/rest/v1/rpc/get_private_inbox",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + currentAccessToken
      },
      body:"{}"
    }
  );

  const data = await res.json();
  if(!res.ok){
    box.innerHTML = '<div class="empty">صندوق پیام آماده نیست. SQL نسخه ۷ را اجرا کنید.</div>';
    return;
  }

  if(!Array.isArray(data) || !data.length){
    box.innerHTML = '<div class="empty">هنوز پیامی دریافت نکرده‌اید.</div>';
    return;
  }

  box.innerHTML = data.map(x => {
    const unread = Number(x.unread_count || 0);
    const badge = unread > 0 ? `<span class="badge">${unread}</span>` : "";
    return `<div class="contact inboxItem" onclick="openChat('${String(x.partner_id).replace(/'/g,"\\'")}','${escapeHtml(x.partner_name || "کاربر").replace(/'/g,"\\'")}')">
      <div class="row"><b>👤 ${escapeHtml(x.partner_name || "کاربر")}</b>${badge}</div>
      <div class="lastMessage">${escapeHtml(x.last_message || "")}</div>
      <div class="hint">${x.last_created_at ? new Date(x.last_created_at).toLocaleString("fa") : ""}</div>
    </div>`;
  }).join("");
}

async function loadContacts(){
  const res = await fetch(
    SUPABASE_URL + "/rest/v1/contacts?user_id=eq." +
    encodeURIComponent(currentUser.id) +
    "&select=id,contact_id,display_name&order=id.desc",
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + currentAccessToken
      }
    }
  );

  const data = await res.json();
  const box = document.getElementById("contactsList");

  if(!Array.isArray(data) || !data.length){
    box.innerHTML = '<div class="empty">هنوز کاربری به مخاطبین اضافه نکرده‌اید.</div>';
    return;
  }

  box.innerHTML = data.map(c => `
    <div class="contact contactRow">
      <div class="contactWrap">
        <div class="contactMain" onclick="openChat('${String(c.contact_id).replace(/'/g,"\'")}','${escapeHtml(c.display_name).replace(/'/g,"\'")}')">
          <div><b>👤 ${escapeHtml(c.display_name)}</b></div>
          <div class="hint">برای باز کردن گفت‌وگو ضربه بزنید</div>
        </div>
        <button class="menuBtn" onclick="toggleContactMenu(event,'menu_${String(c.id)}')">⋮</button>
      </div>
      <div id="menu_${String(c.id)}" class="menuPopup" style="display:none">
        <button onclick="deleteContact(event,'${String(c.id)}')">🗑️ حذف کاربر</button>
      </div>
    </div>
  `).join("");
}

function toggleContactMenu(event, id){
  event.stopPropagation();
  document.querySelectorAll('.menuPopup').forEach(x=>{ if(x.id!==id) x.style.display='none'; });
  const el=document.getElementById(id);
  if(el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

async function deleteContact(event, contactRowId){
  event.stopPropagation();
  if(!confirm('این کاربر از مخاطبین حذف شود؟')) return;
  const res=await fetch(SUPABASE_URL+'/rest/v1/contacts?id=eq.'+encodeURIComponent(contactRowId),{
    method:'DELETE',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+currentAccessToken}
  });
  if(!res.ok){ alert('حذف کاربر انجام نشد.'); return; }
  await loadContacts();
}

document.addEventListener('click',()=>{
  document.querySelectorAll('.menuPopup').forEach(x=>x.style.display='none');
});

function openChat(contactId, displayName){
  const url = "ArtinNNG_9_chat.html?user=" +
    encodeURIComponent(contactId) +
    "&name=" +
    encodeURIComponent(displayName);
  window.location.href = url;
}

if(loadSession()){
  loadInbox();
  loadContacts();
  setInterval(loadInbox, 4000);
}

</script>
</body>
</html>
